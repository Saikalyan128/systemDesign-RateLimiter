services:
    redis:
        image: redis:latest
        container_name: my-rate-limiter-redis
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        command: redis-server --requirepass anumulasaikalyan6969 --appendonly yes
        restart: unless-stopped
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 30s
          timeout: 10s
          retries: 3
volumes:
    redis-data:
        driver: local